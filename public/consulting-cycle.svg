<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="개원 컨설팅 4단계 순환도">
  <defs>
    <style>
      .lbl { font-family: 'Pretendard Variable', 'Malgun Gothic', sans-serif; font-weight: 800; fill: #fff; }
      .num { font-family: 'Pretendard Variable', 'Malgun Gothic', sans-serif; font-weight: 800; fill: #221E1F; }
      .ctr { font-family: 'Pretendard Variable', 'Malgun Gothic', sans-serif; fill: #04211F; }
    </style>
  </defs>

  <!-- 순환 화살표 (배경) -->
  <g fill="none" stroke="#D7E3E0" stroke-width="7" stroke-linecap="round">
    <path d="M116 66a165 165 0 0 0-50 50" />
    <path d="M334 116a165 165 0 0 0-50-50" />
    <path d="M284 334a165 165 0 0 0 50-50" />
    <path d="M66 284a165 165 0 0 0 50 50" />
  </g>
  <g fill="#D7E3E0">
    <path d="M120 56l14 12-19 5z" />
    <path d="M344 120l-12 14-5-19z" />
    <path d="M280 344l-14-12 19-5z" />
    <path d="M56 280l12-14 5 19z" />
  </g>

  <!-- 4분할 부채꼴 -->
  <!-- 상단 (1) 입지·계약 -->
  <path d="M200 200 L200 48 A152 152 0 0 1 352 200 Z" fill="#F4B740" transform="rotate(-45 200 200)" />
  <!-- 우측 (2) 인테리어 -->
  <path d="M200 200 L352 200 A152 152 0 0 1 200 352 Z" fill="#B03A8C" transform="rotate(-45 200 200)" />
  <!-- 하단 (3) 인허가·행정 -->
  <path d="M200 200 L200 352 A152 152 0 0 1 48 200 Z" fill="#D6453F" transform="rotate(-45 200 200)" />
  <!-- 좌측 (4) 개원·운영 -->
  <path d="M200 200 L48 200 A152 152 0 0 1 200 48 Z" fill="#2C6E8F" transform="rotate(-45 200 200)" />

  <!-- 중앙 흰 원 -->
  <circle cx="200" cy="200" r="72" fill="#fff" />
  <text class="ctr" x="200" y="192" text-anchor="middle" font-size="30" font-weight="900">개원</text>
  <text class="ctr" x="200" y="222" text-anchor="middle" font-size="19" font-weight="600">컨설팅</text>

  <!-- 중앙과 각 구획을 잇는 점 -->
  <g fill="#fff">
    <circle cx="200" cy="122" r="6" />
    <circle cx="278" cy="200" r="6" />
    <circle cx="200" cy="278" r="6" />
    <circle cx="122" cy="200" r="6" />
  </g>

  <!-- 구획 라벨 -->
  <text class="lbl" x="200" y="88" text-anchor="middle" font-size="17">입지·계약</text>
  <text class="lbl" x="312" y="195" text-anchor="middle" font-size="17">인테리어</text>
  <text class="lbl" x="312" y="215" text-anchor="middle" font-size="17">설계</text>
  <text class="lbl" x="200" y="322" text-anchor="middle" font-size="17">인허가·행정</text>
  <text class="lbl" x="88" y="195" text-anchor="middle" font-size="17">개원·경영</text>
  <text class="lbl" x="88" y="215" text-anchor="middle" font-size="17">컨설팅</text>

  <!-- 번호 원 -->
  <g>
    <circle cx="200" cy="30" r="27" fill="#fff" stroke="#EEF2F1" stroke-width="2" />
    <text class="num" x="200" y="39" text-anchor="middle" font-size="24">1</text>
    <circle cx="370" cy="200" r="27" fill="#fff" stroke="#EEF2F1" stroke-width="2" />
    <text class="num" x="370" y="209" text-anchor="middle" font-size="24">2</text>
    <circle cx="200" cy="370" r="27" fill="#fff" stroke="#EEF2F1" stroke-width="2" />
    <text class="num" x="200" y="379" text-anchor="middle" font-size="24">3</text>
    <circle cx="30" cy="200" r="27" fill="#fff" stroke="#EEF2F1" stroke-width="2" />
    <text class="num" x="30" y="209" text-anchor="middle" font-size="24">4</text>
  </g>
</svg>
