<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="AI와 병원을 결합한 픽토그램">
  <title>AI 기반 병원 컨설팅</title>

  <!-- 프로세서 핀 — AI 연산. 밝은 배너 위라 진한 청록으로 또렷하게 -->
  <g stroke="#10a696" stroke-width="3.4" stroke-linecap="round">
    <path d="M42 10v12M60 6v16M78 10v12" />
    <path d="M42 98v12M60 98v16M78 98v12" />
    <path d="M10 42h12M10 78h12" />
    <path d="M98 42h12M98 78h12" />
  </g>
  <g fill="#10a696">
    <circle cx="42" cy="9" r="3.4" />
    <circle cx="60" cy="5" r="3.4" />
    <circle cx="78" cy="9" r="3.4" />
    <circle cx="42" cy="111" r="3.4" />
    <circle cx="60" cy="115" r="3.4" />
    <circle cx="78" cy="111" r="3.4" />
    <circle cx="9" cy="42" r="3.4" />
    <circle cx="9" cy="78" r="3.4" />
    <circle cx="111" cy="42" r="3.4" />
    <circle cx="111" cy="78" r="3.4" />
  </g>

  <!-- 칩 본체 — 구조를 잡는 진한 딥 청록 -->
  <rect x="22" y="22" width="76" height="76" rx="17" fill="none" stroke="#04211f" stroke-width="4" />

  <!-- 의료 십자 — 병원 -->
  <g fill="#10a696">
    <rect x="53" y="37" width="14" height="46" rx="4" />
    <rect x="37" y="53" width="46" height="14" rx="4" />
  </g>
</svg>
